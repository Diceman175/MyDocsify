---
# ============================================================
# Template: Project File with Metadata Tracking (YAML Format)
# Purpose: Demonstrates how to structure a .yaml file with
#          metadata, changelog, and semantic version tracking
# ============================================================
#
# Instructions:
# 1. Copy this file and rename it to your project filename
# 2. Update the metadata section with your project details
#    NOTE: metadata.version must always match the latest
#          changelog entry version
# 3. Keep filename in sync with the actual filename on disk
# 4. Add your project data/content below the changelog
# 5. Update changelog with each release using the change codes
#    defined in rules-change-codes.jsonc
# ============================================================

# METADATA SECTION - Required for all tracked files
metadata:
  title: Your Project Title          # One-line description
  description: >                     # Multi-line description (folded block)
    A brief description of what this file contains and its purpose
    in your project. Use the folded block (>) for readability.
  author: Your Name                  # Author or team
  status: draft                      # draft | active | deprecated | archived
  version: 1.4.0                     # Semantic version: MAJOR.MINOR.PATCH — must match latest changelog entry
  template_version: 1.4.0            # Version of this template used to create the file
  filename: your-project-file.yaml   # Must match the actual filename on disk
  tags: []                           # Optional: [tag1, tag2] for discoverability
  created: 2026-04-25                # ISO 8601: YYYY-MM-DD — set once, never changed
  updated: 2026-04-25                # ISO 8601: YYYY-MM-DD — update on every release

# ============================================================
# CHANGELOG SECTION - Required for version tracking
# ============================================================
changelog:
  - version: "1.4.0"
    date: 2026-04-25
    author: Your Name
    changes:
      - IMP: Added status, template_version, and tags fields to metadata
      - CHG: Renamed date/lastmod to created/updated for clarity
      - CHG: Split changelog version string into separate version, date, author keys
      - CHG: Replaced example project content block with placeholder comment
      - DOC: Added note that metadata.version must match latest changelog entry
      - DOC: Added filename sync warning to instructions
      - DOC: Removed duplicate rules-change-codes.jsonc reference from changelog header
      - DOC: Added WIP pre-commit-only caveat to changelog usage notes

  - version: "1.3.0"
    date: 2026-04-25
    author: Your Name
    changes:
      - CHG: Updated changelog format to new entry template
      - DOC: Renamed USAGE NOTES to CHANGELOG USAGE, removed redundant version numbering block
      - FIX: Corrected YAML indentation in changelog section

  - version: "1.1.0"
    date: 2026-04-20
    author: Your Name
    changes:
      - IMP: Initial project setup with metadata template

# ============================================================
# PROJECT CONTENT SECTION - Your actual data/configuration
# ============================================================
# Everything below this comment is your project-specific data.
# Delete this comment and add your own content here.
# ============================================================

# YOUR CONTENT GOES HERE

# ============================================================
# CHANGELOG USAGE
# ============================================================
#
# The most recent change entries are on top.
# Reference change codes from rules-change-codes.jsonc for semantic versioning.
# Copy and paste this block above the previous most recent entry.
# After adding an entry, update metadata.version to match.
#
# ============================================================
# SEMANTIC CHANGE CODES
# ============================================================
#
#   BRK  Breaking changes          major bump
#   CFG  Configuration changes     minor bump
#   CHG  Improvements/refactoring  minor bump
#   DEL  File or feature removed   minor bump
#   DEP  Dependency updates        patch bump
#   DOC  Documentation updates     patch bump
#   FIX  Bug fixes                 patch bump
#   IMP  New features              minor bump
#   OPS  Operational/deployment    patch bump
#   REF  Documentation/references  patch bump
#   SEC  Security fixes            patch bump
#   TST  Tests or CI updates       patch bump
#   WIP  Work in progress          none (pre-commit only — do not use in committed changelog entries)
#
# For full code definitions, see rules-change-codes.jsonc
#
# ============================================================
# CHANGELOG ENTRY TEMPLATE
# ============================================================
#
#   - version: "X.Y.Z"
#     date: YYYY-MM-DD
#     author: Your Name
#     changes:
#       - CHG: Short summary of what changed
#       - FIX: Another summary of what else changed
#
# ============================================================
