name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint core markdown docs
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            README.md
            CHANGELOG.md
            RELEASE_CHECKLIST.md

  python-quality:
    name: Python Lint and Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint dependency
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint for critical Python issues
        run: ruff check . --select E9,F63,F7,F82

      - name: Compile smoke test
        run: |
          python -m py_compile settings.py
          python -m py_compile main.py
          python -m py_compile credly.py
          python -m py_compile githubRepo.py
          python -m py_compile test_chromedriver.py
