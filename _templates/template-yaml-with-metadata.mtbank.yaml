# ============================================================
# Title: <document_title> <!-- omit from toc -->
# Formatting: aligns to `template_yaml-files-mtbank.yaml`
# Purpose: contains a skeleton of the minimum default metadata
#           to track in all .yaml files. Keep at the top of
#           the file, and seperate with start-end block
# ============================================================
# Everything above the MTBANK:CONFIG-START block is metadata.
# Everything below MTBANK:CONFIG-START is consumable yaml.
# Do not place metadata below MTBANK:CONFIG-START block.
# ============================================================

---

metadata:
  filename: <file_name.yaml>    <!-- # file name (informational) -->
  title: <document title>       <!-- # one-line summary -->
  description: >                <!-- # longer description (folded block) -->
    <!-- A one- to two-paragraph description of what this .yaml config or
    document is for, what consumes it, and high-level behavior. --> 
  authorname: <author_name>    <!-- # Author -->
  version: 1.1.0               <!-- # semantic version: MAJOR.MINOR.PATCH -->
  created: 2026-04-01          <!-- # ISO 8601 date YYYY-MM-DD -->
  last_updated: 2026-04-20     <!-- # ISO 8601 date YYYY-MM-DD of last change -->

Change_log: <!-- (most recent first). Each entry includes version, date, author, and short notes. -->
- 1.1.0 (2026-04-20) Steven Paradise
	- FIX: Corrected path expansion for Windows consumers
	- DOC: Added invocation examples
- 1.0.0 (2026-04-01) Steven Paradise
	- IMP: Initial release; core schema and defaults
 <!-- codes align to 'rules-change-codes.yaml`` --> 

