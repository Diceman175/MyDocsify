# ============================================================
# Metadata Section
# ============================================================

[metadata]
filename     = "your-config.toml"
title        = "Your TOML Configuration"
description  = "A brief description of what this file configures"
authorname   = "Your Name"
version      = "0.1.0"
created      = "2026-04-20"
last_updated = "2026-04-20"

# ============================================================
# Changelog Section
# ============================================================

[[changelog]]
version = "0.1.0"
date    = "2026-04-20"
author  = "Your Name"

  [[changelog.changes]]
  code = "IMP"
  note = "Initial TOML configuration setup with metadata template"

# ============================================================
# General Configuration
# ============================================================

[general]
name        = "Example Project"
enabled     = true
environment = "development"
debug_mode  = false

# ============================================================
# Database Configuration
# ============================================================

[database]
server   = "localhost"
port     = 5432
name     = "your_database"
username = "your_user"
password = "your_password"
timeout  = 30
pool_size = 10

# ============================================================
# Logging Configuration
# ============================================================

[logging]
level      = "info"
log_path   = "./logs"
format     = "json"
max_size   = 104857600  # bytes (100 MB)
retention  = 30         # days

# ============================================================
# Performance Configuration
# ============================================================

[performance]
max_connections    = 100
request_timeout    = 30
cache_enabled      = true
cache_duration_min = 60

# ============================================================
# Feature Flags
# ============================================================

[features]
feature_a     = true
feature_b     = false
beta_features = false

# ============================================================
# Data Items (Array of Tables)
# ============================================================

[[items]]
id     = 1
name   = "Item One"
status = "active"

[[items]]
id     = 2
name   = "Item Two"
status = "inactive"
