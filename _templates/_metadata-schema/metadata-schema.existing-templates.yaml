# ============================================================
# METADATA:
#   title:         Metadata Schema — Existing Templates Inventory
#   description:   Machine-readable inventory of all templates registered in this workspace
#   author:        Steven Paradise
#   filename:      metadata-schema.existing-templates.yaml
#   schema_version: 2.0.0
#   version:       2.1.0
#   date:          2026-04-24
#   lastmod:       2026-05-02
# ============================================================
#
# PURPOSE:
#   This file is a sidecar to metadata-schema.yaml.
#   It holds the full existing_templates inventory that was previously embedded
#   inline in metadata-schema.yaml.  The main file references this via:
#     existing_templates_ref: "metadata-schema.existing-templates.yaml"
#
# STRUCTURE:
#   Each top-level key is a language/type category.
#   Each value is a list of template filenames found under _templates/{category}/.
#   Each template appears only once under its canonical owning category.
#
# DESIGN DECISIONS:
#   - node owns template-json-with-metadata-package.json.
#   - typescript owns template-json-with-metadata-tsconfig.json and template-ts-with-metadata.ts.
#   - json is reserved for generic JSON templates rather than ecosystem-specific artefacts.
#   - Categories follow creation/usage priority, not alphabetical sort order.
# ============================================================

