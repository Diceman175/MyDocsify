<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="city-inputs">
            <input type="text" id="city1" placeholder="Enter city 1">
            <input type="text" id="city2" placeholder="Enter city 2">
            <input type="text" id="city3" placeholder="Enter city 3">
            <input type="text" id="city4" placeholder="Enter city 4">
            <input type="text" id="city5" placeholder="Enter city 5">
            <button id="getWeather">Get Weather</button>
        </div>
        <div id="weatherResults" class="weather-results">
            <!-- Weather results will be displayed here -->
        </div>
    </div>
    <script src="scripts/script.js"></script>
</body>
</html>
